# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: noajulkunen
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: iot-temperature-sensor
# "service" is the name of this project. This will also be added to your AWS resource names.
service: backend

useDotenv: true

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [Dynamotable, Arn]
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawMail
          Resource: "*"

  environment:
    DYNAMODB_TABLE_NAME: ${self:custom.DYNAMODB_TABLE_NAME}
    EMAIL_ADDRESS: ${self:custom.EMAIL_ADDRESS}
    DYNAMODB_TABLE_NAME_TEMPERATURE: ${self:custom.DYNAMODB_TABLE_NAME_TEMPERATURE}

custom:
  DYNAMODB_TABLE_NAME: ${env:DYNAMODB_TABLE_NAME}
  EMAIL_ADDRESS: ${env:EMAIL_ADDRESS}
  DYNAMODB_TABLE_NAME_TEMPERATURE: ${env:DYNAMODB_TABLE_NAME_TEMPERATURE}

functions:
  getMeasurement:
    handler: handler.getMeasurement
    events:
      - httpApi:
          path: /measurement/{measurementId}
          method: get
  createMeasurement:
    handler: handler.createMeasurement
    events:
      - httpApi:
          path: /measurement
          method: post
  deleteMeasurement:
    handler: handler.deleteMeasurement
    events:
      - httpApi:
          path: /measurement/{measurementId}
          method: delete
  updateMeasurement:
    handler: handler.updateMeasurement
    events:
      - httpApi:
          path: /measurement/{measurementId}
          method: put
  getAllMeasurements:
    handler: handler.getAllMeasurements
    events:
      - httpApi:
          path: /measurements
          method: get
  updateTemperatureLimit:
    handler: handler.updateTemperatureLimit
    events:
      - httpApi:
          path: /temperature/limit
          method: put
  getTemperatureLimits:
    handler: handler.getTemperatureLimits
    events:
      - httpApi:
          path: /temperature/{sensorId}
          method: get
resources:
  Resources:
    Dynamotable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.DYNAMODB_TABLE_NAME}
        AttributeDefinitions:
          - AttributeName: measurementId
            AttributeType: S
        KeySchema:
          - AttributeName: measurementId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    LimitTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.DYNAMODB_TABLE_NAME_TEMPERATURE}
        AttributeDefinitions:
          - AttributeName: sensorId
            AttributeType: S
        KeySchema:
          - AttributeName: sensorId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
